name: Verify GoDaddy production checkout
on:
  push:
    branches: [main]
    paths:
      - vercel.json
      - scripts/godaddy-production-browser-smoke.mjs
      - .github/workflows/godaddy-production-smoke.yml
permissions:
  contents: read
concurrency:
  group: godaddy-production-smoke
  cancel-in-progress: true
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install isolated browser test dependency
        run: npm install --no-save --package-lock=false --ignore-scripts playwright && npx playwright install --with-deps chromium
      - name: Native storefront to actual GoDaddy checkout, no monetary submissions
        id: smoke
        continue-on-error: true
        run: node scripts/godaddy-production-browser-smoke.mjs
      - name: Preserve measured results and public-layout screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: godaddy-production-browser-smoke
          path: |
            docs/godaddy-production-browser-smoke-20260910.json
            artifacts/godaddy-launch
          if-no-files-found: error
          retention-days: 7
      - name: Require successful smoke check
        if: steps.smoke.outcome != 'success'
        run: exit 1
