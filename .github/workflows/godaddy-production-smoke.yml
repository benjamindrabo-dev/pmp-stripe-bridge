name: Verify GoDaddy production checkout
on:
  push:
    branches: [main]
    paths:
      - vercel.json
      - scripts/godaddy-production-browser-smoke.mjs
      - .github/workflows/godaddy-production-smoke.yml
permissions:
  contents: write
concurrency:
  group: godaddy-production-smoke
  cancel-in-progress: true
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install isolated browser test dependency
        run: npm install --no-save --ignore-scripts playwright && npx playwright install --with-deps chromium
      - name: Native storefront to actual GoDaddy checkout, no monetary submissions
        id: smoke
        continue-on-error: true
        run: node scripts/godaddy-production-browser-smoke.mjs
      - name: Preserve measured non-secret results
        if: always()
        run: |
          if [ ! -f docs/godaddy-production-browser-smoke-20260910.json ]; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/godaddy-production-browser-smoke-20260910.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Record actual native storefront GoDaddy launch smoke test'
          git pull --rebase origin main
          git push origin HEAD:main
      - name: Save public-layout screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: godaddy-production-browser-smoke
          path: artifacts/godaddy-launch
          if-no-files-found: ignore
          retention-days: 3
      - name: Require successful smoke check
        if: steps.smoke.outcome != 'success'
        run: exit 1
