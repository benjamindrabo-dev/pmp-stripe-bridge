name: Inspect public GoDaddy wallet SDK
on:
  push:
    branches: [main]
    paths: [.github/workflows/godaddy-wallet-sdk-inspect.yml]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Download public SDK only, without credentials or payment requests
        run: |
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          const response = await fetch('https://collect.commerce.godaddy.com/sdk.js', {redirect:'error', signal:AbortSignal.timeout(15000)});
          if (!response.ok) throw new Error('SDK_HTTP_' + response.status);
          const text = await response.text();
          if (!text.includes('TokenizeJs') || text.length > 5000000) throw new Error('SDK_RESPONSE_INVALID');
          fs.writeFileSync('godaddy-public-sdk.js', text);
          console.log(JSON.stringify({publicSdkDownloaded:true,bytes:Buffer.byteLength(text),payments:0}));
          JS
      - uses: actions/upload-artifact@v4
        with:
          name: godaddy-public-wallet-sdk
          path: godaddy-public-sdk.js
          retention-days: 1
