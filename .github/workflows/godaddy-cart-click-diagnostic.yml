name: Diagnose GoDaddy cart click
on:
  push:
    branches: [main]
    paths:
      - scripts/godaddy-cart-click-diagnostic.mjs
      - .github/workflows/godaddy-cart-click-diagnostic.yml
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install isolated browser
        run: npm install --no-save --package-lock=false --ignore-scripts playwright && npx playwright install --with-deps chromium
      - name: Inspect actual anonymous cart and checkout responses without paying
        run: node scripts/godaddy-cart-click-diagnostic.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: godaddy-cart-click-diagnostic
          path: artifacts/godaddy-cart-click
          retention-days: 3
          if-no-files-found: ignore
