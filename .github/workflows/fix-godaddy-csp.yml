name: Fix GoDaddy SDK dependency loading
on:
  push:
    branches: [main]
    paths: [.github/workflows/fix-godaddy-csp.yml]
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Permit only the observed GoDaddy anti-fraud SDK origin
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('public/godaddy-checkout.html')
          text=p.read_text()
          for old,new in [
              ("script-src 'self' https://collect.commerce.godaddy.com;", "script-src 'self' https://collect.commerce.godaddy.com https://api.sardine.ai;"),
              ("connect-src 'self' https://*.poynt.net https://*.godaddy.com;", "connect-src 'self' https://*.poynt.net https://*.godaddy.com https://api.sardine.ai;"),
              ("frame-src https://collect.commerce.godaddy.com https://*.poynt.net https://*.godaddy.com;", "frame-src https://collect.commerce.godaddy.com https://*.poynt.net https://*.godaddy.com https://api.sardine.ai;")
          ]:
              if new in text: continue
              if text.count(old)!=1: raise RuntimeError('Unexpected CSP source')
              text=text.replace(old,new,1)
          p.write_text(text)
          p=Path('public/godaddy-checkout.js');text=p.read_text()
          old="collect.on('ready',()=>{ready=true;$('card-state').textContent='';controls();});"
          new="collect.on('ready',()=>{ready=true;$('card-element').dataset.sdkReady='true';$('card-state').textContent='';controls();});"
          if new not in text:
              if text.count(old)!=1: raise RuntimeError('Unexpected ready handler')
              text=text.replace(old,new,1)
          p.write_text(text)
          PY
          node --check public/godaddy-checkout.js
          git diff --check
      - name: Publish only the SDK loading correction
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/godaddy-checkout.html public/godaddy-checkout.js
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Allow GoDaddy fraud-protection loader and record SDK ready state without reading card fields'
          git push origin HEAD:main
