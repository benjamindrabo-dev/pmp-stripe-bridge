name: Use Direct Google Ads Access

on:
  push:
    paths:
      - ".github/workflows/patch-google-mcp-oauth.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Remove forced MCC login header
        run: python3 scripts/use-direct-google-ads-access.py

      - name: Syntax check
        run: node --check api/mcp.js

      - name: Commit direct Google Ads access
        shell: bash
        run: |
          if git diff --quiet -- api/mcp.js; then
            echo "Direct Google Ads access is already configured."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add api/mcp.js
          git commit -m "Use direct Google Ads customer access"
          git push
