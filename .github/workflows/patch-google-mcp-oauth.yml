name: Add Google Shopping MCP Tools

on:
  push:
    paths:
      - ".github/workflows/patch-google-mcp-oauth.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Add Shopping read, write, and create tools
        run: python3 scripts/add-shopping-tools.py

      - name: Syntax check
        run: node --check api/mcp.js && node --check lib/mcp-oauth.js

      - name: Commit Shopping MCP tools
        shell: bash
        run: |
          if git diff --quiet -- api/mcp.js; then
            echo "No Shopping MCP patch was needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add api/mcp.js
          git commit -m "Add Standard Shopping campaign creation and bid controls"
          git push
