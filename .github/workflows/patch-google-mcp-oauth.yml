name: Apply Primary Google Ads Account

on:
  push:
    paths:
      - ".github/workflows/patch-google-mcp-oauth.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Apply known non-secret configuration
        run: python3 scripts/embed-known-config.py

      - name: Syntax check
        run: |
          node --check api/mcp.js
          node --check lib/mcp-oauth.js
          node --check lib/mcp-health.js

      - name: Commit primary Google Ads account
        shell: bash
        run: |
          if git diff --quiet -- api/mcp.js lib/mcp-oauth.js lib/mcp-health.js; then
            echo "Primary Google Ads account is already configured."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add api/mcp.js lib/mcp-oauth.js lib/mcp-health.js
          git commit -m "Use Google Ads account 6591205737 as primary"
          git push
