name: Final Square production verification
on:
  push:
    paths:
      - '.github/workflows/verify-square-final.yml'
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Record signed webhook acknowledgements without customer data
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('api/square-webhook.js');s=p.read_text()
          if 'recordAcknowledged' not in s:
              s=s.replace('import {get,WEBHOOK_URL,','import {get,set,WEBHOOK_URL,',1)
              marker='export default async function handler(req,res){'
              helper="""// Store only delivery status, never notification payloads or customer data.
          async function recordAcknowledged(res,body){
            try { await set(squareWebhookKey()+':receipt',{httpStatus:200,signatureVerified:true,receivedAt:Date.now()},2592000); } catch { /* Diagnostics must not invalidate a successful order. */ }
            return res.status(200).json(body);
          }
          """
              s=s.replace(marker,helper+marker,1)
              s=s.replace("if(!payment?.id||!validId(payment.reference_id)||payment.status!=='COMPLETED')return res.status(200).json({ignored:true});", "if(!payment?.id||!validId(payment.reference_id)||payment.status!=='COMPLETED')return recordAcknowledged(res,{ignored:true});",1)
              s=s.replace('return res.status(200).json(await settleSquarePayment(payment.id));','return recordAcknowledged(res,await settleSquarePayment(payment.id));',1)
              p.write_text(s)
              p=Path('api/square-health.js');s=p.read_text()
              s=s.replace('const [hook,apple,verification]=await Promise.all([get(squareWebhookKey()),get(squareApplePayKey()),get(squareVerificationKey())]);',"const [hook,apple,verification,receipt]=await Promise.all([get(squareWebhookKey()),get(squareApplePayKey()),get(squareVerificationKey()),get(squareWebhookKey()+':receipt')]);",1)
              s=s.replace("revision:'square-account-restore-2026-09-09'","revision:'square-account-restore-2026-09-09-r2'",1)
              s=s.replace('webhookTestStatus:verification?.squareDeliveryStatus??null,',"webhookTestStatus:verification?.squareDeliveryStatus??null,\n      signedWebhookDeliveryStatus:receipt?.signatureVerified===true?receipt.httpStatus:null,",1)
              p.write_text(s)
              p=Path('lib/square-bridge.js');s=p.read_text()
              s=s.replace('if(prior?.squareDeliveryStatus===200 && prior?.invalidSignatureRejected)return;',"const receipt=await get(squareWebhookKey()+':receipt');\n  if(prior?.invalidSignatureRejected && (prior?.squareDeliveryStatus===200 || receipt?.signatureVerified===true))return;",1)
              p.write_text(s)
          PY
          npm install --ignore-scripts --no-audit --no-fund
          npm test > /tmp/square-tests.log 2>&1 || { tail -n 100 /tmp/square-tests.log; exit 1; }
          tail -n 10 /tmp/square-tests.log
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add api/square-webhook.js api/square-health.js lib/square-bridge.js
          if ! git diff --cached --quiet; then
            git commit -m 'Observe verified Square deliveries independently of asynchronous test API results'
            git push origin HEAD:main
          fi
      - name: Wait for verified production revision
        run: |
          node --input-type=module <<'JS'
          let ready=false;
          for(let i=0;i<36;i++){
            try{const s=await (await fetch('https://checkout.puremajestypet.com/api/square-health')).json();if(s.revision==='square-account-restore-2026-09-09-r2'){ready=true;break;}}catch{}
            await new Promise(r=>setTimeout(r,5000));
          }
          if(!ready)throw Error('Latest deployment not observed');
          JS
      - name: Check all five market checkouts without submitting card data
        run: |
          mkdir -p /tmp/pmp-qa
          npm install --prefix /tmp/pmp-qa playwright --no-audit --no-fund
          /tmp/pmp-qa/node_modules/.bin/playwright install --with-deps chromium > /tmp/pmp-browser-install.log 2>&1
          node scripts/verify-square-restored.mjs
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import {writeFileSync} from 'node:fs';
          const s=await (await fetch('https://checkout.puremajestypet.com/api/square-health')).json();
          console.log('Final configuration:',JSON.stringify(s));
          assert.equal(s.ready,true);assert.equal(s.signedWebhookDeliveryStatus,200);assert.equal(s.invalidSignatureRejected,true);assert.equal(s.applePay,'VERIFIED');
          writeFileSync('/tmp/pmp-qa/results/configuration.json',JSON.stringify(s,null,2));
          console.log('PASS: all five markets, signed Square delivery, invalid signature rejection, Apple Pay registration. No payment made.');
          JS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: square-final-verification
          path: /tmp/pmp-qa/results
          if-no-files-found: ignore
