name: Inspect Shopify test variant availability
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/godaddy-test-item-probe.yml
      - scripts/godaddy-test-item-probe.mjs
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node scripts/godaddy-test-item-probe.mjs
