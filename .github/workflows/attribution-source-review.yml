name: GoDaddy attribution regression
on:
  push:
    branches: [main, fix/godaddy-attribution-20260910]
    paths:
      - lib/godaddy-attribution.js
      - lib/godaddy-cart.js
      - lib/godaddy-embedded.js
      - api/meta-offer-summary.js
      - api/stripe-webhook.js
      - test/godaddy-attribution.test.js
      - .github/workflows/attribution-source-review.yml
permissions:
  contents: read
jobs:
  attribution:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Syntax and offline regressions; no live credentials or payment requests
        run: |
          node --check lib/godaddy-attribution.js
          node --check lib/godaddy-cart.js
          node --test test/godaddy-*.test.js test/order-attribution-notes.test.js test/meta-offer-summary-tracking.test.js test/create-checkout-correlation.test.js test/stripe-cad*.test.js test/square-bridge.test.js
