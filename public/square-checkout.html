<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><meta name="referrer" content="no-referrer"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://web.squarecdn.com https://sandbox.web.squarecdn.com; connect-src 'self' https://*.squareup.com https://*.squareupsandbox.com https://*.squarecdn.com; frame-src https://*.squareup.com https://*.squareupsandbox.com https://*.squarecdn.com https://*.google.com; img-src 'self' data: https:; style-src 'self' 'unsafe-inline'; font-src 'self' https:; form-action 'self'; base-uri 'none'"><title>Secure checkout — Pure Majesty Pets</title><style>

</style><script src="/square-checkout.js" defer></script></head><body><header>PURE MAJESTY PETS</header><main><section><h1 data-i18n="checkout">Secure checkout</h1><form id="checkout-form"><h2 data-i18n="contact">Contact</h2><label for="email" data-i18n="email">Email</label><input id="email" type="email" autocomplete="email" required><h2 data-i18n="delivery">Delivery address</h2><div class="row"><div><label for="first" data-i18n="first">First name</label><input id="first" autocomplete="given-name" required></div><div><label for="last" data-i18n="last">Last name</label><input id="last" autocomplete="family-name" required></div></div><label for="country" data-i18n="country">Country</label><input id="country" readonly><label for="address" data-i18n="address">Address</label><input id="address" autocomplete="shipping address-line1" required><label for="address2" data-i18n="address2">Apartment, suite (optional)</label><input id="address2" autocomplete="shipping address-line2"><div class="row"><div><label for="city" data-i18n="city">City</label><input id="city" autocomplete="shipping address-level2" required></div><div><label for="state" data-i18n="state">State / province / region</label><input id="state" autocomplete="shipping address-level1" placeholder="QC, NY…"></div></div><label for="zip" data-i18n="zip">Postal code</label><input id="zip" autocomplete="shipping postal-code"><label><input type="checkbox" id="same" checked> <span data-i18n="same">Billing address is the same as delivery</span></label><div id="billing" hidden><label for="bcountry" data-i18n="countryCode">Billing country (two-letter code)</label><input id="bcountry" maxlength="2" placeholder="US, CA, FR…"><label for="baddress" data-i18n="address">Address</label><input id="baddress" autocomplete="billing address-line1"><label for="bcity" data-i18n="city">City</label><input id="bcity" autocomplete="billing address-level2"><label for="bstate" data-i18n="state">State / province / region</label><input id="bstate" autocomplete="billing address-level1"><label for="bzip" data-i18n="zip">Postal code</label><input id="bzip" autocomplete="billing postal-code"></div><h2 data-i18n="payment">Payment</h2><div id="card"></div><p id="charge" class="muted"></p><p class="muted"><span data-i18n="terms">By ordering, you acknowledge our</span> <a href="https://www.puremajestypet.com/pages/shipping-returns" target="_blank" rel="noopener" data-i18n="policy">shipping and returns policy</a>.</p><button id="pay" type="submit" disabled data-i18n="loading">Loading secure payment…</button><div id="wallets" hidden><p class="muted" data-i18n="walletHint">Or pay with a digital wallet after completing your address.</p><button id="applepay" type="button" hidden>Apple Pay</button><div id="googlepay"></div></div><p id="status" role="status" aria-live="polite"></p></form></section><aside><h2 data-i18n="summary">Your order</h2><div id="items"></div><div class="line"><span data-i18n="shipping">Shipping</span><span id="shipping"></span></div><div class="line total"><span data-i18n="total">Total</span><span id="total"></span></div><label for="promo" data-i18n="promo">Promotion code</label><div class="code"><input id="promo"><button id="apply" type="button" data-i18n="apply">Apply</button></div><p id="promo-status" role="status"></p><p class="muted"><a id="back" href="https://www.puremajestypet.com/cart" data-i18n="back">Return to store</a></p><p class="muted"><a href="https://www.exchangerate-api.com" target="_blank" rel="noopener">Exchange rates by ExchangeRate-API</a></p></aside></main></body></html>
